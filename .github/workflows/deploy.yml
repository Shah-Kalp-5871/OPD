name: Deploy OPD System

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e  # Exit immediately on any error
            echo "========================================="
            echo "🚀 Starting OPD System Deployment..."
            echo "========================================="

            cd /home/opd_deploy/opd-system

            # Pull latest code
            echo "📥 Pulling latest changes..."
            git pull origin main

            # ── BACKEND ────────────────────────────────────────────────────
            echo "⚙️  Deploying Backend..."
            cd backend

            echo "📦 Installing backend dependencies..."
            npm install

            echo "🗄️  Running database migrations..."
            # Use migrate deploy (NOT db push) so migration history is respected
            npx prisma migrate deploy

            echo "🔨 Building backend..."
            npm run build

            echo "♻️  Restarting backend service..."
            pm2 restart opd-backend || pm2 start dist/main.js --name opd-backend

            # ── FRONTEND ───────────────────────────────────────────────────
            echo "🎨 Deploying Frontend..."
            cd ../frontend

            echo "📦 Installing frontend dependencies..."
            npm install

            echo "🔨 Building frontend..."
            npm run build

            echo "♻️  Restarting frontend service..."
            PORT=3005 pm2 restart opd-frontend --update-env || PORT=3005 pm2 start npm --name opd-frontend -- start

            # ── DONE ───────────────────────────────────────────────────────
            echo "========================================="
            echo "✅ Deployment successful!"
            echo "   Backend : pm2 status opd-backend"
            echo "   Frontend: pm2 status opd-frontend"
            echo "========================================="

# =============================================================================
# MedFlow OPD — Full Stack Validation Pipeline
# Runs on PRs to main — validates both backend and frontend together
# =============================================================================

name: Full Stack Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Validate entire docker-compose can be parsed
  # ──────────────────────────────────────────────────────────────────────────
  compose-validate:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production compose file
        run: |
          # Substitute required env vars for validation only
          export POSTGRES_PASSWORD=ci_placeholder
          export JWT_SECRET=ci_placeholder_jwt_secret_minimum_32_chars_long
          export REDIS_PASSWORD=ci_placeholder_redis
          export CORS_ORIGIN=https://ci.example.com
          export NEXT_PUBLIC_API_URL=/api
          docker compose -f docker-compose.production.yml config --quiet
          echo "✅ docker-compose.production.yml is valid"

      - name: Validate development compose file
        run: |
          docker compose -f docker-compose.development.yml config --quiet
          echo "✅ docker-compose.development.yml is valid"

  # ──────────────────────────────────────────────────────────────────────────
  # Security scan — check for hardcoded secrets
  # ──────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # Warning only — don't fail CI on first run

  # ──────────────────────────────────────────────────────────────────────────
  # Dependency Audit
  # ──────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found in backend"

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high || echo "⚠️ High severity vulnerabilities found in frontend"

  # ──────────────────────────────────────────────────────────────────────────
  # Final Gate — Summary
  # ──────────────────────────────────────────────────────────────────────────
  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [compose-validate, dependency-audit]
    if: always()

    steps:
      - name: Report status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "MedFlow Full Stack Validation Complete"
          echo "Compose: ${{ needs.compose-validate.result }}"
          echo "Deps:    ${{ needs.dependency-audit.result }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

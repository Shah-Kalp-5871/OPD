# =============================================================================
# MedFlow OPD — Frontend CI Pipeline
# Validates: TypeScript build, Next.js build, Docker image
# =============================================================================

name: Frontend CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

env:
  NODE_VERSION: '20'
  WORKING_DIR: './frontend'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: TypeScript Type Check
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --frozen-lockfile

      - name: Run TypeScript type check
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Next.js Build
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: typecheck

    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: /api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --frozen-lockfile

      - name: Build Next.js application
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      - name: Verify .next output exists
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          test -d .next && echo "✅ .next directory exists" || (echo "❌ .next build output missing" && exit 1)

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Docker Build Validation
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate frontend Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: false
          tags: medflow-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api

      - name: Confirm image was built
        run: echo "✅ Frontend Docker image built successfully"

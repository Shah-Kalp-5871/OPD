# =============================================================================
# MedFlow OPD — Backend CI Pipeline
# Validates: TypeScript build, Prisma schema, unit tests
# Triggers: every push / PR to main and develop
# =============================================================================

name: Backend CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

env:
  NODE_VERSION: '20'
  WORKING_DIR: './backend'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: TypeScript Type Check
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: npx prisma generate

      - name: Run TypeScript type check
        working-directory: ${{ env.WORKING_DIR }}
        run: npx tsc --noEmit --project tsconfig.build.json

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Build Validation
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: NestJS Build
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: npx prisma generate

      - name: Build NestJS application
        working-directory: ${{ env.WORKING_DIR }}
        run: npm run build

      - name: Verify dist output exists
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          test -f dist/main.js && echo "✅ dist/main.js exists" || (echo "❌ dist/main.js missing" && exit 1)

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Prisma Schema Validation
  # ──────────────────────────────────────────────────────────────────────────
  prisma-validate:
    name: Prisma Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --frozen-lockfile

      - name: Validate Prisma schema
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: npx prisma validate

      - name: Generate Prisma client (dry run)
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: npx prisma generate

      - name: Check for pending migrations
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: npx prisma migrate status || echo "⚠️ Cannot check migration status without DB — expected in CI"

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Unit Tests
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package-lock.json'

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: npm ci --frozen-lockfile

      - name: Generate Prisma client
        working-directory: ${{ env.WORKING_DIR }}
        env:
          DATABASE_URL: 'postgresql://placeholder:placeholder@localhost:5432/placeholder'
        run: npx prisma generate

      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIR }}
        run: npm test -- --passWithNoTests --forceExit

  # ──────────────────────────────────────────────────────────────────────────
  # Job 5: Docker Build Validation
  # ──────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate backend Dockerfile build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: false
          tags: medflow-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm image was built
        run: echo "✅ Backend Docker image built successfully"

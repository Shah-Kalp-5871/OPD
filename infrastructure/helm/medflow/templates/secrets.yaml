apiVersion: v1
kind: Secret
metadata:
  name: {{ include "medflow.fullname" . }}-secrets
  namespace: {{ .Release.Namespace | default .Values.global.namespace }}
  labels:
    app: {{ include "medflow.name" . }}
    release: {{ .Release.Name }}
type: Opaque
data:
  # Base64 encoded placeholders. Real values should be passed via --set or secret overrides in CI/CD.
  DATABASE_URL: {{ default "cG9zdGdyZXNxbDovL21lZGZsb3dfdXNlcjpzdXBlcl9zZWN1cmVfcGFzc3dvcmRAcG9zdGdyZXMtMC5wb3N0Z3Jlcy5tZWRmbG93LnN2Yy5jbHVzdGVyLmxvY2FsOjU0MzIvbWVkZmxvd19kYg==" .Values.secrets.DATABASE_URL | quote }}
  REDIS_URL: {{ default "cmVkaXM6Ly9yZWRpcy1zZW50aW5lbC5tZWRmbG93LnN2Yy5jbHVzdGVyLmxvY2FsOjI2Mzc5" .Values.secrets.REDIS_URL | quote }}
  JWT_SECRET: {{ default "c3VwZXItc2VjdXJlLWp3dC1zZWNyZXQtMjg3MzY0ODk=" .Values.secrets.JWT_SECRET | quote }}
  SESSION_SECRET: {{ default "c3VwZXItc2VjdXJlLXNlc3Npb24tc2VjcmV0LTgxNzIzNjQ4" .Values.secrets.SESSION_SECRET | quote }}
  ENCRYPTION_KEY: {{ default "MzJieXRlc3N1cGVyc2VjdXJlZW5jcnlwdGlvbmtleTEyMzQ1Ng==" .Values.secrets.ENCRYPTION_KEY | quote }}
  DIGITAL_SIGNATURE_KEY: {{ default "ZGlnaXRhbC1zaWduYXR1cmUtc2VjcmV0LWtleS05ODcyMzQ=" .Values.secrets.DIGITAL_SIGNATURE_KEY | quote }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "medflow.fullname" . }}-config
  namespace: {{ .Release.Namespace | default .Values.global.namespace }}
  labels:
    app: {{ include "medflow.name" . }}
    release: {{ .Release.Name }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  PORT: {{ .Values.backend.port | quote }}
  ENABLE_REDIS_CACHE: {{ .Values.backend.env.enableRedisCache | quote }}
  REDIS_SENTINEL_ENABLED: {{ .Values.backend.env.redisSentinelEnabled | quote }}
  REDIS_SENTINEL_MASTER: {{ .Values.backend.env.redisSentinelMaster | quote }}
  REDIS_SENTINEL_NODES: {{ .Values.backend.env.redisSentinelNodes | quote }}
  ENABLE_AUDIT_LOGGING: {{ .Values.backend.env.enableAuditLogging | quote }}
  LOG_LEVEL: {{ .Values.backend.env.logLevel | quote }}
  COMMUNICATION_MAX_RETRIES: {{ .Values.backend.env.communicationMaxRetries | quote }}
  WEBSOCKET_HEARTBEAT_INTERVAL: {{ .Values.backend.env.websocketHeartbeatInterval | quote }}
  AUTO_SCALING_THRESHOLD: {{ .Values.backend.env.autoScalingThreshold | quote }}

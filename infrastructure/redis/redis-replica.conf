# =============================================================================
# MedFlow HA Replica Configuration
# =============================================================================
port 6379
dir /data

# Require client authentication
requirepass super_secure_redis_password
masterauth super_secure_redis_password

# Replicate from the primary node
replicaof redis-master 6379

# Active safety limits
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

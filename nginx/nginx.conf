# =============================================================================
# MedFlow — Nginx Main Configuration
# Production-hardened reverse proxy
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Tuned for multi-core production servers
events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;           # Hide nginx version

    # ── Gzip Compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ── Upload / Buffer Limits ──
    client_max_body_size  15M;       # Slightly above backend 10MB limit
    client_body_timeout   60s;
    client_header_timeout 30s;
    send_timeout          60s;

    # ── Proxy Buffering ──
    proxy_buffering          on;
    proxy_buffer_size        16k;
    proxy_buffers            4 32k;
    proxy_busy_buffers_size  64k;
    proxy_connect_timeout    10s;
    proxy_read_timeout       60s;
    proxy_send_timeout       60s;

    # ── Rate Limiting Zones ──
    limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/m;

    # ── WebSocket Upgrade Map ──
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}

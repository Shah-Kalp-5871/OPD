# =============================================================================
# MedFlow — Nginx Virtual Host Configuration
# Routes: /opd → frontend | /api → backend | /socket.io → backend WS
# =============================================================================

# ── Upstream Definitions ──
upstream medflow_backend {
    server backend:3001;
    keepalive 32;
}

upstream medflow_frontend {
    server frontend:3000;
    keepalive 16;
}

# ──────────────────────────────────────────────────────────────────────────────
# HTTP Server — Redirect all HTTP to HTTPS in production
# (Remove redirect block and uncomment the HTTP section for non-SSL setups)
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ACME challenge for Let's Encrypt (SSL certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS
    # Comment out the return below and enable the proxy blocks below for non-SSL
    return 301 https://$host$request_uri;

    # ── Non-SSL direct proxy (comment out return above, uncomment below) ──
    # include /etc/nginx/conf.d/proxy-locations.conf;
}

# ──────────────────────────────────────────────────────────────────────────────
# HTTPS Server — Production Entry Point
# ──────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name _;

    # ── SSL Configuration ──
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ── Security Headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options     "nosniff"                                      always;
    add_header X-XSS-Protection           "1; mode=block"                                always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"     always;
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com; \
         img-src 'self' data: blob:; \
         connect-src 'self' wss: ws:; \
         frame-ancestors 'none';"         always;

    # ── Logging ──
    access_log /var/log/nginx/medflow_access.log main;
    error_log  /var/log/nginx/medflow_error.log  warn;

    # ──────────────────────────────────────────
    # /api  → NestJS Backend (REST API)
    # ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass         http://medflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Larger timeout for long-running clinical operations
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────
    # /api/auth  → Stricter Rate Limiting
    # ──────────────────────────────────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass         http://medflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────
    # /api/uploads  → Upload rate limiting
    # ──────────────────────────────────────────
    location /api/file-storage/ {
        limit_req zone=upload_limit burst=5 nodelay;
        client_max_body_size 15M;

        proxy_pass         http://medflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────
    # /socket.io  → WebSocket Upgrade (Socket.IO)
    # ──────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://medflow_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;     # Long timeout for WebSocket connections
        proxy_send_timeout 3600s;
        proxy_cache_bypass $http_upgrade;
    }

    # ──────────────────────────────────────────
    # /opd  → Next.js Frontend (SSR)
    # ──────────────────────────────────────────
    location /opd {
        proxy_pass         http://medflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ──────────────────────────────────────────
    # Next.js Static Assets (_next/static)
    # ──────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://medflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Aggressive caching for immutable static assets
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ──────────────────────────────────────────
    # Next.js HMR (WebSocket for dev — not needed in prod but harmless)
    # ──────────────────────────────────────────
    location /_next/webpack-hmr {
        proxy_pass         http://medflow_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
    }

    # ──────────────────────────────────────────
    # Root redirect → /opd
    # ──────────────────────────────────────────
    location = / {
        return 301 /opd;
    }

    # ──────────────────────────────────────────
    # Deny access to hidden files (.git, .env etc.)
    # ──────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ──────────────────────────────────────────
    # 404 Fallback
    # ──────────────────────────────────────────
    error_page 404 /opd;
}

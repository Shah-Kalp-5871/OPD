apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-policy
  namespace: medflow
spec:
  podSelector:
    matchLabels:
      app: medflow-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress strictly from external ingress-controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Egress allowed only for DNS and contacting internal backend service (Next.js SSR fetches)
    - to:
        - podSelector:
            matchLabels:
              app: medflow-backend
      ports:
        - protocol: TCP
          port: 4000
    - to:
        - namespaceSelector: {} # Allow DNS resolution
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-policy
  namespace: medflow
spec:
  podSelector:
    matchLabels:
      app: medflow-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Backend allows ingress from ingress-controller and frontend pods
    - from:
        - podSelector:
            matchLabels:
              app: medflow-frontend
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
      ports:
        - protocol: TCP
          port: 4000
  egress:
    # Backend can connect to PostgreSQL, Redis, and resolve DNS
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 26379
    - to:
        - namespaceSelector: {} # Allow DNS resolution
      ports:
        - protocol: UDP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-redis-isolation-policy
  namespace: medflow
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # DB accepts ingress ONLY from backend pods. No direct frontend access!
    - from:
        - podSelector:
            matchLabels:
              app: medflow-backend
      ports:
        - protocol: TCP
          port: 5432
